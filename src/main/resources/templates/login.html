<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="UTF-8">
		<link rel="stylesheet" href="css/login.css">
		<title>ログイン</title>
	</head>
	
	<body class="center">
		<div th:replace="fragments/header :: commonHeader"></div>
		<div th:if="${error} == 1 ">
			<h1 th:text="${errorMessage}">ここにメッセージが表示されます</h1>
		</div>
		<h2 class="center">ログイン</h2>
		<hr/>
		<div class="center">
			<form action="/forMenu" method="POST">
				<table class="center">
					<tr>
						<th>社員ID</th>
						<td><input type="text" id="empID" name="empID" value="" size="24"></td>
					</tr>
					<tr>
						<th>パスワード</th>
						<td><input type="password" id="password" name="password" value="" size="24"></td>
					</tr>
				</table>
				<input type="submit" value="ログイン" />
			</form>
			
		</div>
	</body>
</html>
