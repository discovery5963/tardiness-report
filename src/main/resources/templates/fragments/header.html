<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<body>
<header class="header" th:fragment="commonHeader">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <div class="header-left" th:if="${empId != null}">
        <table border="1" class="table-header">
            <tr>
                <th>&nbsp;名　前&nbsp;</th>
                <td>&nbsp;&nbsp;[[${empLname}]] [[${empFname}]]&nbsp;&nbsp;</td>
            </tr>
            <tr>
                <th>&nbsp;所　属&nbsp;</th>
                <td>&nbsp;&nbsp;UNIT[[${unitNo}]]&nbsp;&nbsp;</td>
            </tr>
            <tr>
                <th>&nbsp;チーム名&nbsp;</th>
                <td>&nbsp;&nbsp;[[${teamName}]]&nbsp;&nbsp;</td>
            </tr>
            <tr>
                <th>&nbsp;役　職&nbsp;</th>
                <td>&nbsp;&nbsp;[[${roleName}]]&nbsp;&nbsp;</td>
            </tr>
        </table>
    </div>

    <div class="header-center">
        <h1>勤怠連絡システム</h1>
    </div>

    <div class="header-right" th:if="${empId != null}">
        <form action="/menuReturn" method="Get">
            <input type="submit" value="メニューに戻る" class="button-menu"/>
        </form>
        <form action="/logout" method="Post">
            <input type="submit" value="ログアウト" class="button-logout"/>
        </form>
    </div>
</header>

</body>
</html>
