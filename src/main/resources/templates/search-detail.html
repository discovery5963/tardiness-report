<!DOCTYPE html>

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" href="css/search-detail.css">
        <title>検索・参照</title>
        <style>
          body {
            font-family: sans-serif;
            margin: 20px;
          }
          fieldset {
            border: 2px solid #666;
            padding: 15px;
            margin-bottom: 20px;
          }
          legend {
            font-weight: bold;
            padding: 0 10px;
          }
          .search-row {
            display: flex;
            gap: 30px;
            align-items: flex-start;
            flex-wrap: wrap;
          }
          .form-group {
            display: flex;
            flex-direction: column;
          }
          label {
            margin-bottom: 5px;
            font-weight: bold;
          }
          .inline-inputs {
            display: flex;
            gap: 10px;
            align-items: center;
          }
          table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
          }
          th, td {
            border: 1px solid #ccc;
            padding: 8px;
            text-align: left;
          }
          .buttons {
            margin-top: 10px;
          }
        </style>

        <!-- 路線・社員名選択用 -->
        <script>
            $(document).ready(function() {
                $('#line-select').select2({
                placeholder: '検索ワードを入力'
                });
            });

            $(document).ready(function() {
                $('#employee-select').select2({
                placeholder: '検索ワードを入力'
                });
            });
        </script>
    </head>
    <body>
        <form method="post" th:object="${searchDetailForm}" th:action="@{/search}">
        <fieldset>
           <legend>検索条件</legend>
           <div class="search-row">
            <!-- 期間 -->
             <div class="form-group">
               <label>期間:</label>
               <div class="inline-inputs">
                   <input type="date" id="start-date" th:field="*{startDate}">&nbsp;-
                   <input type="date" id="end-date" th:field="*{endDate}">&nbsp;
               </div>
             </div>
             <!-- 路線 -->
             <div class="form-group">
             <label>路線:</label>
               <select id="line-select" th:field="*{lineId}">
                   <option value="選択してください。"></option>
                   <option
                       th:each="item : ${lineList}"
                       th:value="${item.lineId}"
                       th:text="${item.lineName}"
                       th:selected="${item.lineId == searchDetailForm.lineId}">
                   </option>
               </select>

               <div class="inline-inputs">
                   <input type="checkbox" th:field="*{islineOthers}" id="islineOthers" value="true"/>その他
               </div>

             </div>
             <!-- 社員名称 -->
             <div class="form-group">
             <label>社員名称:</label>
               <select id="employee-select" th:field="*{empId}">
                   <option value="選択してください。"></option>
                   <option
                       th:each="item : ${employeeList}"
                       th:value="${item.empId}"
                       th:text="${item.empLname + ' ' + item.empFname}"
                       th:selected="${item.empId == searchDetailForm.empId}">
                   </option>
               </select>
             </div>
         
             <!-- 検索ボタン -->
             <div class="form-group">
               <label>&nbsp;</label>
               <!-- <button>検索</button> -->
               <button type="submit" name="doSearch">検索</button>
             </div>
           </div>
        </fieldset>


        <!-- 初期表示＝falseの場合のみ表示 -->
        <!-- <span>表示件数: 10　1～10件／〇〇件　ページ: 1/5</span> -->
        <!-- <button style="float: right;">CSV出力</button> -->
        <table class='page_link' th:if="${!isInitial}">
          <tr>
            <td><div class="left-align">{{.ViewingDataCount}}</div></td>
            <td><div class="left-align">~</div></td>
            <td><div class="left-align">{{.ViewingDataCount}}件</div></td>
            <td><div class="left-align">/</div></td>
            <td><div class="left-align">{{.AllDataCount}}件</div></td>
            <td><div class="center-align">表示件数： {{.ViewingDataCount}}</div></td>
            <td>
              <!-- 前へボタン押下時の処理 -->
              <div class="right-align">
                  <input type="submit" disabled id="previousPage" name="goPrevious" value="◀" class="btn btn-secondary" />
                  <input type="hidden" id="screen" name="screen" value="検索・参照画面" />
                  <input type="hidden" id="searchKeyword" name="searchKeyword" value={{.SearchKeyword}}/>
                  <input type="hidden" id="currentPageNumber" name="currentPageNumber" value= ""/>
                  <input type="hidden" id="action" name="action" value="prev"/>
                  <input type="hidden" id="previousPageLinkFlg" name="previousPageLinkFlg" value= "{{.PreviousPageLinkFlg}}"/>
            </td>
              </div>
            <td><div class="right-align">1/5</div></td>
            <td>
              <!-- 次へボタン押下時の処理 -->
              <div class="right-align">
                  <input type="submit" id="nextPage" name="goNext" value="▶" class="btn btn-secondary" />
                  <input type="hidden" id="screen" name="screen" value="検索・参照画面" />
                  <input type="hidden" id="searchKeyword" name="searchKeyword" value={{.SearchKeyword}}/>
                  <input type="hidden" id="currentPageNumber" name="currentPageNumber" value= ""/>
                  <input type="hidden" id="action" name="action" value= "next"/>
                  <input type="hidden" id="nextPageLinkFlg" name="nextPageLinkFlg" value= "{{.NextPageLinkFlg}}"/>
              </div>
            </td>
            <td><button style="float: right;">CSV出力</button></td>
          </tr>
        </table>
        <!-- 初期表示＝falseの場合のみ表示 -->
      
        <!-- 初期表示＝falseの場合のみ表示 -->
        <table class='search_results' th:if="${!isInitial}">
            <thead>
            <tr>
                <th>日付</th>
                <th>社員名</th>
                <th>理由</th>
                <th>路線</th>
                <th>内容</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${results}">
                <td th:text="${item.registeredDate}"></td>
                <td th:text="${item.empLname + ' ' + item.empFname}"></td>
                <td th:text="${item.lateReason}"></td>
                <td th:text="${item.lineName}"></td>
                <td th:text="${item.detail}"></td>
                <td><button>編集</button></td>
            </tr>
            </tbody>
        </table>
        <!-- 初期表示＝falseの場合のみ表示 -->
        </form>
    </body>
</html>
