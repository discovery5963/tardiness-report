<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" th:href="@{css/search-detail.css}">
        <link rel="stylesheet" th:href="@{css/common.css}">
        <link rel="stylesheet" th:href="@{/css/header.css}">
        <title>検索・参照</title>
        <!-- 路線・社員名選択用 -->
        <script>
            $(document).ready(function() {
                $('#line-select').select2({
                placeholder: '検索ワードを入力'
                });
            });

            $(document).ready(function() {
                $('#employee-select').select2({
                placeholder: '検索ワードを入力'
                });
            });
        </script>
    </head>
    <body>
        <div th:replace="fragments/header :: commonHeader"></div>
        <form method="post" th:object="${searchDetailForm}" th:action="@{/search}">
        <fieldset>
           <legend>検索条件</legend>
           <div class="search-row">
            <!-- 期間 -->
             <div class="form-group">
               <label>期間:</label>
               <div class="inline-inputs">
                   <input type="date" id="start-date" th:field="*{startDate}">&nbsp;-
                   <input type="date" id="end-date" th:field="*{endDate}">&nbsp;
               </div>
             </div>
             <!-- 路線 -->
             <div class="form-group">
             <label>路線:</label>
               <select id="line-select" th:field="*{lineId}">
                   <option value=""></option>
                   <option
                       th:each="item : ${lineList}"
                       th:value="${item.lineId}"
                       th:text="${item.lineName}"
                       th:selected="${item.lineId == searchDetailForm.lineId}">
                   </option>
               </select>

               <div class="inline-inputs">
                   <input type="checkbox" th:field="*{islineOthers}" id="islineOthers" value="true"/>その他
               </div>

             </div>
             <!-- 社員名称 -->
             <div class="form-group">
             <label>社員名称:</label>
               <select id="employee-select" th:field="*{empId}">
                   <option value=""></option>
                   <option
                       th:each="item : ${employeeList}"
                       th:value="${item.empId}"
                       th:text="${item.empLname + ' ' + item.empFname}"
                       th:selected="${item.empId == searchDetailForm.empId}">
                   </option>
               </select>
             </div>
         
             <!-- 検索ボタン -->
             <div class="form-group">
               <label>&nbsp;</label>
               <!-- <button>検索</button> -->
               <button type="submit" name="doSearch">検索</button>
             </div>
             <div th:if="${errorMessage}">
              <p th:text="${errorMessage}" style="color: #ff0000;"></p>
             </div>
           </div>
        </fieldset>


        <!-- 初期表示＝falseの場合のみ表示 -->
        <!-- <span>表示件数: 10　1～10件／〇〇件　ページ: 1/5</span> -->
        <!-- <button style="float: right;">CSV出力</button> -->
        <table class='page_link' th:if="${!isInitial}">
          <tr>
            <td><div class="left-align" style="display: inline-block;" th:text="${viewingDataCount}"></div>/</td>
            <td><div class="left-align" style="display: inline-block;" th:text="${allCount}"></div>件</td>
            <td><div class="center-align" style="display: inline-block;" th:text="${itemsPerPage}"></div>件</td>
            <td>
              <!-- 前へボタン押下時の処理 -->
              <div class="right-align">
                  <input type="submit" id="previousPage" name="goPrevious" value="◀" class="btn btn-secondary" />
                  <!-- <input type="hidden" id="screen" name="screen" value="検索・参照画面" /> -->
                  <input type="hidden" name="currentPageNumber" th:value="${currentPageNumber}" />
                  <input type="hidden" id="action" name="action" value="prev"/>
                  <input type="hidden" id="previousPageLinkFlg" name="previousPageLinkFlg" value= "{{.PreviousPageLinkFlg}}"/>
            </td>
              </div>
            <td><div class="right-align">1/5</div></td>
            <td>
              <!-- 次へボタン押下時の処理 -->
              <div class="right-align">
                  <input type="submit" id="nextPage" name="goNext" value="▶" class="btn btn-secondary" />
                  <input type="hidden" id="screen" name="screen" value="検索・参照画面" />
                  <input type="hidden" name="currentPageNumber" th:value="${currentPageNumber}" />
                  <input type="hidden" id="action" name="action" value= "next"/>
                  <input type="hidden" id="nextPageLinkFlg" name="nextPageLinkFlg" value= "{{.NextPageLinkFlg}}"/>
              </div>
            </td>
            <td><button type="submit" name="csvOutput" style="float: right;">CSV出力</button></td>
          </tr>
        </table>
        <!-- 初期表示＝falseの場合のみ表示 -->
      
        <!-- 初期表示＝falseの場合のみ表示 -->
        <table class='search_results' th:if="${!isInitial}">
            <thead>
            <tr>
                <th>日付</th>
                <th>社員名</th>
                <th>理由</th>
                <th>路線</th>
                <th>内容</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td th:text="${#temporals.format(item.registerDate.toLocalDateTime(), 'yyyy-MM-dd')}"></td>
                <td th:text="${item.empLname + ' ' + item.empFname}"></td>
                <td th:switch="${item.lateReasonCd}">
                    <span th:case="'1'">電車遅刻</span>
                    <span th:case="'2'">その他</span>
                </td>
                <td th:text="${item.lineName}"></td>
                <td th:text="${item.detail}"></td>
                <td><button>編集</button></td>
            </tr>
            </tbody>
        </table>
        <!-- 初期表示＝falseの場合のみ表示 -->
        </form>
    </body>
</html>
