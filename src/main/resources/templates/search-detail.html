<!DOCTYPE html>
<html lang="ja" xmlns:th="http://www.thymeleaf.org">

<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<html lang="ja">
    <head>
        <meta charset="UTF-8">
        <link rel="stylesheet" th:href="@{css/search-detail.css}">
        <link rel="stylesheet" th:href="@{css/common.css}">
        <link rel="stylesheet" th:href="@{/css/header.css}">
        <title>検索・参照</title>
        <!-- 路線・社員名選択用 -->
        <script>
            $(document).ready(function() {
                $('#line-select').select2({
                placeholder: '検索ワードを入力',
                allowClear: true,
                width: '100%'
                });
            });

            $(document).ready(function() {
                $('#employee-select').select2({
                placeholder: '検索ワードを入力',
                allowClear: true,
                width: '100%'
                });
            });
            
        </script>
    </head>
    <body>
        <div th:replace="fragments/header :: commonHeader"></div>
        <form method="post" th:object="${searchDetailForm}" th:action="@{/search}">
        <fieldset>
           <legend>検索条件</legend>
           <div class="search-row">
             <!-- 期間 -->
             <div class="form-group">
               <label>期間:</label>
               <div class="inline-inputs">
                   <input type="date" id="start-date" th:field="*{startDate}">&nbsp;-
                   <input type="date" id="end-date" th:field="*{endDate}">&nbsp;
               </div>
             </div>
             <!-- 路線 -->
             <div class="form-group">
             <label>路線:</label>
               <select id="line-select" th:field="*{lineId}">
                   <option value=""></option>
                   <option
                       th:each="item : ${lineList}"
                       th:value="${item.lineId}"
                       th:text="${item.lineName}"
                       th:selected="${item.lineId == searchDetailForm.lineId}">
                   </option>
               </select>
               
               <div class="inline-inputs">
                   <input type="checkbox" th:field="*{islineOthers}" id="islineOthers" value="true"/>その他
               </div>

             </div>
             <!-- 社員名称 -->
             <!-- 開始 ログインユーザの役職の値が1より大きい場合(=管理者者)のみ表示 -->
             <div th:if="${session.role > '1'}">
                 <div class="form-group">
                     <label>社員名称:</label>
                     <select id="employee-select" th:field="*{empId}">
                         <option value=""></option>
                         <option
                             th:each="item : ${employeeList}"
                             th:value="${item.empId}"
                             th:text="${item.empName}"
                             th:selected="${item.empId == searchDetailForm.empId}">
                         </option>
                     </select>
                 </div>
             </div>
             <!-- 終了 ログインユーザの役職の値が1より大きい場合(=管理者者の場合)のみ表示 -->
         
             <!-- 検索ボタン -->
             <div class="form-group">
                 <label>&nbsp;</label>
                 <button type="submit" name="doSearch">検索</button>
             </div>

             <!-- エラーメッセージ -->
             <div th:if="${errorMessage}">
                 <p th:text="${errorMessage}" style="color: #ff0000;"></p>
             </div>

           </div>
        </fieldset>

        <!-- 初期表示＝falseの場合のみ表示 -->
        <table class='page_link' th:if="${isInitial == false}">
          <tr>
            <!-- 表示件数 -->
            <td><div class="left-align" style="display: inline-block;" th:text="${searchDetailForm.viewingDataCount}"></div>/
                <span class="left-align" style="text-align:left;" th:text="${searchDetailForm.allDataCount}"></span>件
                <input type="hidden" th:field="*{allDataCount}">
            </td>

            <td>
              <!-- 前へボタン押下時の処理 -->
              <div class="right-align">
                  <input type="submit" id="previousPage" name="goPrevious" value="◀" class="btn btn-secondary" th:disabled="${searchDetailForm.currentPageNumber == 1 || searchDetailForm.currentPageNumber == 0}"/>
                  <!-- <input type="hidden" id="screen" name="screen" value="検索・参照画面" /> -->
                  <input type="hidden" name="currentPageNumber" th:value="${searchDetailForm.currentPageNumber}"/>
                  <input type="hidden" id="action" name="action" value="prev"/>
                  <!-- <input type="hidden" id="previousPageLinkFlg" name="previousPageLinkFlg" value= "{{.PreviousPageLinkFlg}}"/> -->
                </div>
            </td>
            <!-- <td><div class="right-align">1/5</div></td> -->
            <td><div class="right-align" style="display: inline-block;" th:text="${searchDetailForm.currentPageNumber}"></div>/<div class="right-align" style="display: inline-block;" th:text="${searchDetailForm.maxPageNumber}"></div>
                <input type="hidden" name="maxPageNumber" th:value="${searchDetailForm.maxPageNumber}">
            </td>
            <td>
              <!-- 次へボタン押下時の処理 -->
              <div class="right-align">
                  <input type="submit" id="nextPage" name="goNext" value="▶" class="btn btn-secondary" th:disabled="${searchDetailForm.currentPageNumber == 0 || searchDetailForm.lastPage}" />
                  <input type="hidden" id="screen" name="screen" value="検索・参照画面" />
                  <input type="hidden" name="currentPageNumber" th:value="${searchDetailForm.currentPageNumber}" />
                  <input type="hidden" id="action" name="action" value= "next"/>
                  <!-- <input type="hidden" id="nextPageLinkFlg" name="nextPageLinkFlg" value= "{{.NextPageLinkFlg}}"/> -->
              </div>
            </td>
            <td><button type="submit" name="csvOutput" style="float: right;">CSV出力</button></td>
          </tr>
        </table>
        <!-- 初期表示＝falseの場合のみ表示 -->
      
        <!-- 初期表示＝falseの場合のみ表示 -->
        <table class='search_results' th:if="${isInitial == false}">
            <thead>
            <tr>
                <th>日付</th>
                <th>社員名</th>
                <th>理由</th>
                <th>路線</th>
                <th>内容</th>
                <th>操作</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="item : ${resultList}">
                <td th:text="${#temporals.format(item.registerDate.toLocalDateTime(), 'yyyy-MM-dd')}"></td>
                <td th:text="${item.empName}"></td>
                <td th:switch="${item.lateReasonCd}">
                    <span th:case="'1'">電車遅延</span>
                    <span th:case="'2'">その他</span>
                </td>
                <td th:text="${item.lineName}"></td>
                <td th:text="${item.detail}" style="text-align: left;"></td>
                <td>
                    <div class="edit-block"
                        th:data-emp-name="${item.empName}"
                        th:data-register-date="${#temporals.format(item.registerDate.toLocalDateTime(), 'yyyy-MM-dd')}">
                        <form action="/search" method="post">
                            <input type="hidden" id="lateReasonId" name="lateReasonId" th:value="${item.lateReasonId}" />
                            <button type="submit" id="editButton" name="doEdit">編集</button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
        <!-- 初期表示＝falseの場合のみ表示 -->
        </form>
        <script>
            $(document).ready(function() {

                const checkbox = document.getElementById('islineOthers');

                function updateState() {

                    if (checkbox.checked) {
                        $('#line-select').val(null).trigger('change');
                        $('#line-select').select2('destroy');
                        $('#line-select').prop('disabled', true);
                        return;
                    }

                    $('#line-select').prop('disabled', false);

                    $('#line-select').select2({
                        placeholder: '検索ワードを入力',
                        allowClear: true,
                        width: '100%'
                    });
                }

                // 初期状態反映
                updateState();

                // イベント登録
                checkbox.addEventListener('change', updateState);

            });

            document.addEventListener("DOMContentLoaded", function() {

                function convertSlashDateToHyphen(dateStr) {
                    return dateStr.replace(/\//g, '-'); // 日付のフォーマットを「yyyy/MM/dd」 から 「yyyy-MM-dd」へ変換
                }

                document.querySelectorAll('.edit-block').forEach(block => {

                    const button = block.querySelector('#editButton');

                    // ログインユーザー情報
                    const itemRegisterDate = convertSlashDateToHyphen(block.dataset.registerDate);
                    const empFullName = "[[${empLname}]]" + "[[${empFname}]]";
                    
                    const itemEmpName = block.dataset.empName;
                    
                    const today = new Date().toISOString().slice(0, 10);

                    // 編集ボタンの活性、非活性を判別する
                    const condition =
                        empFullName === itemEmpName &&
                        itemRegisterDate === today;

                    if (condition) {
                        button.disabled = false;   // 活性
                    } else {
                        button.disabled = true;    // 非活性
                    }

                });
            });
        </script>
    </body>
</html>
