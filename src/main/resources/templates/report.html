<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<!-- jQuery -->
<script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

<!-- Select2 -->
<link href="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/css/select2.min.css" rel="stylesheet" />
<script src="https://cdn.jsdelivr.net/npm/select2@4.1.0-rc.0/dist/js/select2.min.js"></script>

<head>
    <meta charset="UTF-8">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" href="css/common.css">
    <link rel="stylesheet" href="css/report.css">
    <title>報告画面</title>
    <!-- 路線・社員名選択用 -->
    <script>
            $(document).ready(function () {
                $('#line-select').select2({
                    placeholder: '検索ワードを入力'
                });
                $('#format').on('change', function (event) {
                    const selectedItem = $(this).val();

                    // フォーマット表示改修
                    if (selectedItem === "train") {
                        $('#train').removeClass('hidden');
                        textarea.value = "電車遅延時間：分\r\n現場遅刻時間：分";
                    } else {
                        $('#train').addClass('hidden');
                        textarea.value = "遅刻理由：\r\n到着予定時刻：\r\n業務開始時刻：";
                    }
                });
        });
    </script>

</head>

<body>
    <div th:replace="fragments/header :: commonHeader"></div>
    <form action="/resist" method="post">
        <div id="report" class="hidden">
            <div>
                <h1 id="exists" th:text="${existsFlg} ? '初回連絡登録' : '到着連絡登録'">
                </h1>
            </div>
            <!-- フォーマット選択、路線検索、検索ボタン -->
            <div class="containerWrapper">
                <div class="format">
                    <p>フォーマット選択</p>
                    <select name="format" id="format">
                        <option value="train">電車遅延</option>
                        <option value="free">フリーフォーマット</option>
                    </select>
                </div>
                <div class="containerMiddle">
                    <div id="train" class="hidden">
                        <div>
                            <p>路線検索</p>
                        </div>
                        <select name="lineId" id="line-select">
                            <option value="">選択してください。</option>
                            <option th:each="item : ${lineList}" th:value="${item.lineId}" th:text="${item.lineName}"
                                th:attr="data-line-name=${item.lineName}"
                                th:selected="${item.lineId == selectedLineId}">
                            </option>
                        </select>
                        <input type="hidden" name="lineName" id="lineName">
                        <!-- 内容 -->
                        <div>
                        </div>
                    </div>
                    <div id="free">
                        <div>
                            <p>内容</p>
                            <textarea class="inputDetail" name="inputDetail" th:text="${inputDetail}"></textarea>
                            <div>※500文字以内で入力してください。</div>
                        </div>
                    </div>
                </div>
            </div>
            <button class="botton" type="submit">登録</button>
        </div>
    </form>
    <form action="/modify" method="post">
        <div id="confirm" class="hidden">
            <h1>
                登録内容表示
            </h1>
            <p class="updateMessage" style="color:red">登録完了しました！</p>
            <div class="confirmDetail">
                <div>
                    <p>使用路線</p>
                    <div th:text="${lineName}"></div>
                </div>
                <div>
                    <p>内容</p>
                    <textarea readonly class="inputDetail" name="inputDetail" th:text="${inputDetail}"></textarea>
                </div>
            </div>
            <div class="botton">
                <div class="registButton">
                    <button type="submit">編集</button>
                </div>
            </div>
        </div>
    </form>
</body>

<script th:inline="javascript">
    const typeFlg = /*[[${typeFlg}]]*/ 0;
    const formatFlg = /*[[${formatFlg}]]*/ 0;
    const existsFlg = /*[[${existsFlg}]]*/ 0;

    const train = document.getElementById("train");
    const free = document.getElementById("free");
    const report = document.getElementById("report");
    const confirm = document.getElementById("confirm");

    // フォーマット選択エリア
    const formatArea = document.querySelector('.format');

    // ① existFlg によるフォーマット選択の表示・非表示（最優先）
    if (existsFlg == null) {
        formatArea.classList.add('hidden');   // 更新画面 → 隠す
    } else {
        formatArea.classList.remove('hidden'); // 登録画面 → 表示
    }

    // ② typeFlg による画面切替（existFlg の後に実行）
    if (typeFlg == 1) {
        report.classList.remove("hidden");
        if (formatFlg == 1) {
            train.classList.remove("hidden");
        } else {
            free.classList.remove("hidden");
        }
    } else if (typeFlg == 2) {
        confirm.classList.remove("hidden");
        if (formatFlg == 2) {
            train.classList.remove("hidden");
        }
    }
    // ③ Select2 の change イベント
    $('#format').on('change', function () {
        const selectedItem = $(this).val();
        const textarea = document.getElementsByName('inputDetail')[0];

        if (selectedItem === "train") {
            $('#train').removeClass('hidden');
            textarea.value = "電車遅延時間：分\r\n現場遅刻時間：分";
        } else {
            $('#train').addClass('hidden');
            textarea.value = "遅刻理由：\r\n到着予定時刻：\r\n業務開始時刻：";
        }
    });
</script>

</html>
